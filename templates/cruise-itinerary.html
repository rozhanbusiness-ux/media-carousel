<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
@font-face{ font-family:'Playfair Display'; src:url('../fonts/PlayfairDisplay-Bold.ttf') format('truetype'); font-weight:400 900; }
@font-face{ font-family:'DM Serif Display'; src:url('../fonts/DMSerifDisplay-Regular.ttf') format('truetype'); font-weight:400; }

:root{ --navy:#0F2359; --navy-deep:#0a1838; --gold:#C9A227; --gold-bright:#E6C25A; --white:#FFFFFF; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:1080px; height:1920px; }
.slide{ position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--navy-deep); font-family:'Playfair Display',serif; }
.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; image-rendering:high-quality; }
.overlay{ position:absolute; inset:0; z-index:2; background:linear-gradient(to bottom, rgba(10,24,56,0.62) 0%, rgba(10,24,56,0.80) 40%, rgba(10,24,56,0.90) 100%); }
.content{ position:absolute; inset:0; z-index:3; }

.logo{ position:absolute; top:86px; left:0; width:100%; display:flex; justify-content:center; }
.logo img{ width:359px; height:auto; }

.title{ position:absolute; top:220px; left:0; width:100%; text-align:center;
  font-family:'Playfair Display',serif; font-weight:800; font-size:70px; line-height:1;
  color:var(--white); text-shadow:0 4px 18px rgba(0,0,0,0.5); }

.stops-wrap{ position:absolute; top:0; left:0; width:100%; height:100%; }
.stop-line{ position:absolute; left:106px; width:4px; background:linear-gradient(to bottom, rgba(230,194,90,0.15), var(--gold) 10%, var(--gold) 90%, rgba(230,194,90,0.15)); }
.stop-dot{ position:absolute; left:80px; border-radius:50%; background:var(--gold-bright);
  display:flex; align-items:center; justify-content:center;
  font-family:'DM Serif Display',serif; font-weight:400; color:var(--navy-deep);
  box-shadow:0 3px 10px rgba(0,0,0,0.35); }
.stop-text{ position:absolute; left:172px; right:90px; }
.stop-city{ font-family:'DM Serif Display',serif; font-weight:400; color:var(--white); line-height:1.15;
  text-shadow:0 2px 8px rgba(0,0,0,0.4); }
.stop-day{ font-family:'Playfair Display',serif; font-weight:700; color:var(--gold-bright); margin-top:4px; }
.stop-desc{ font-family:'Playfair Display',serif; font-weight:400; color:rgba(255,255,255,0.78); margin-top:6px; line-height:1.3; }

.footer{ position:absolute; top:1790px; left:0; width:100%; display:flex; align-items:center; justify-content:center; gap:64px; }
.footer .cell{ display:flex; align-items:center; gap:16px; font-family:'DM Serif Display',serif; font-weight:400; font-size:32px; color:var(--white); }
.footer .ic{ width:52px; height:52px; flex:none; }
.footer .ic svg{ width:52px; height:52px; display:block; }
</style>
</head>
<body>
  <div class="slide">
    <img class="bg" src="{{bg_image}}" alt="">
    <div class="overlay"></div>
    <div class="content">
      <div class="logo"><img src="logo.png" alt="MEDIA"></div>
      <div class="title">Reiseverlauf</div>

      <div class="stops-wrap">
        {{stops_html}}
      </div>

      <div class="footer">
        <div class="cell"><span class="ic"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="#C9A227"/><path d="M27 24c-2 0-4 2-4 5 0 14 11 25 25 25 3 0 5-2 5-4l0-6c0-1-1-2-2-2l-7-2c-1 0-2 0-3 1l-2 2c-5-2-8-5-10-10l2-2c1-1 1-2 1-3l-2-7c0-1-1-2-2-2Z" fill="#fff"/></svg></span>+491 765 8866 999</div>
        <div class="cell"><span class="ic"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="#C9A227"/><rect x="20" y="26" width="36" height="24" rx="3" fill="none" stroke="#fff" stroke-width="3"/><path d="M20 27 L38 41 L56 27" fill="none" stroke="#fff" stroke-width="3"/></svg></span>INFO@MEDIA-TRAVELS.COM</div>
      </div>
    </div>
  </div>
</body>
</html>
