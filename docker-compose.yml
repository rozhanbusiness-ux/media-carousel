services:
  media-carousel-app:
    build: .
    container_name: media-carousel-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000" # local only: Nginx (with the login) is the only way in
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      - ./output:/app/output
      - ./cache:/app/cache
