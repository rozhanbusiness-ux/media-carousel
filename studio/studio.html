<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEDIA Studio</title>
<style>
  :root { --navy: #0a1838; --gold: #e6c25a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0d1b3e; color: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--navy); border-bottom: 1px solid rgba(230,194,90,.4); position: sticky; top: 0; z-index: 2; }
  header b { color: var(--gold); letter-spacing: .2em; }
  header a { color: #cfd6e6; font-size: 14px; }
  main { max-width: 1100px; margin: auto; padding: 16px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
  .primary { background: linear-gradient(135deg,#f7e7a8,#c9a227); color: var(--navy); }
  .ok { background: #2e7d4f; color: #fff; } .no { background: #8b2f2f; color: #fff; } .ghost { background: rgba(255,255,255,.12); color: #fff; }
  .cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin: 10px 0; }
  .cand { position: relative; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: none; cursor: pointer; aspect-ratio: 2 / 3; }
  .cand:hover, .cand:focus { border-color: #e6c25a; }
  .cand img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cand span { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.7); color: #e6c25a; font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 999px; }
  .warn { background: #5a3d0a; color: #ffd98a; padding: 10px 14px; border-radius: 12px; margin: 8px 0; }
  .draft { background: rgba(255,255,255,.06); border: 1px solid rgba(230,194,90,.3); border-radius: 16px; padding: 16px; margin: 16px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: #cfd6e6; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .pending { background: #b08a17; } .approved { background: #2e7d4f; } .rejected { background: #8b2f2f; }
  .imgs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; }
  .imgs a img { height: 220px; border-radius: 8px; display: block; }
  textarea { width: 100%; min-height: 200px; border-radius: 10px; padding: 10px; font: 14px/1.5 system-ui; background: #08122b; color: #fff; border: 1px solid rgba(255,255,255,.2); }
  textarea[dir=rtl] { text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  h3 { margin: 14px 0 4px; font-size: 15px; color: var(--gold); }
  #msg { margin: 10px 0; color: #f7e7a8; }
  details.manual { background: rgba(255,255,255,.06); border: 1px solid rgba(230,194,90,.3); border-radius: 16px; padding: 14px 16px; margin: 14px 0; }
  details.manual summary { cursor: pointer; font-weight: 700; color: var(--gold); }
  .form { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; margin-top: 12px; }
  .form label { font-size: 13px; color: #cfd6e6; display: flex; flex-direction: column; gap: 4px; }
  .form input, .form select { width: 100%; min-width: 0; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: #08122b; color: #fff; }
  .full { grid-column: 1 / -1; }
  .chk { font-size: 14px; display: inline-flex; gap: 4px; align-items: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; padding: 10px; border-radius: 12px; background: rgba(0,0,0,.18); }
  .tools select { font: inherit; padding: 8px; border-radius: 8px; background: #08122b; color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .busy { opacity: .5; pointer-events: none; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
</style>
</head>
<body>
<header><b>MEDIA STUDIO</b><a href="/">← Carousel</a></header>
<main>
  <div class="row" style="align-items:center">
    <button class="primary" id="gen">Heutigen Entwurf erstellen</button>
    <span style="font-size:14px;color:#cfd6e6">Sprachen:</span>
    <label class="chk"><input type="checkbox" name="deflang" value="de"> Deutsch</label>
    <label class="chk"><input type="checkbox" name="deflang" value="ar"> العربية</label>
    <label class="chk"><input type="checkbox" name="deflang" value="ckb"> کوردی</label>
    <span style="font-size:12px;color:#8e98b3">(leer = automatisch)</span>
  </div>
  <details class="manual">
    <summary>+ Eigenes Angebot (manuell, Screenshot oder PDF)</summary>
    <div class="row">
      <label class="ghost" style="padding:10px 16px;border-radius:999px;cursor:pointer">📷 Screenshot<input id="shot" type="file" accept="image/*" hidden></label>
      <label class="ghost" style="padding:10px 16px;border-radius:999px;cursor:pointer">📄 PDF<input id="pdf" type="file" accept="application/pdf" hidden></label>
    </div>
    <div class="pick" id="pdfOffers"></div>
    <div class="form">
      <label>Von (Stadt)<input id="fromName" required maxlength="60"></label>
      <label>Flughafen-Code (optional)<input id="fromCode" maxlength="3" placeholder="DUS"></label>
      <label>Nach (Stadt)<input id="toName" required maxlength="60"></label>
      <label>Flughafen-Code (optional)<input id="toCode" maxlength="3" placeholder="EBL"></label>
      <label>Hinflug<input id="departureDate" type="date" required></label>
      <label>Rückflug (optional)<input id="returnDate" type="date"></label>
      <label>Preis ab (€)<input id="price" type="number" min="1" step="0.01" required></label>
      <label>Airline (optional)<input id="airline" maxlength="60"></label>
      <label>Design<select id="style"><option value="">Design des Tages</option>
        <option value="flight">1 Glas</option><option value="flight-ticket">2 Bordkarte</option><option value="flight-split">3 Geteilt</option>
        <option value="flight-diagonal">4 Diagonal</option><option value="flight-postcard">5 Postkarte</option><option value="flight-ribbon">6 Schleife</option><option value="flight-band">7 Goldband</option></select></label>
      <label>Eigenes Foto (optional)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <div class="full"><button class="primary" id="manualGo">Entwurf erstellen</button></div>
    </div>
  </details>
  <div id="msg"></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LANG = { de: 'Deutsch', ar: 'العربية', ckb: 'کوردی (بادینی)' };
const STYLE_NAMES = [['flight', '1 Glas'], ['flight-ticket', '2 Bordkarte'], ['flight-split', '3 Geteilt'], ['flight-diagonal', '4 Diagonal'],
  ['flight-postcard', '5 Postkarte'], ['flight-ribbon', '6 Schleife'], ['flight-band', '7 Goldband']];
const defLangs = () => [...document.querySelectorAll('input[name=deflang]:checked')].map((i) => i.value);
try { const saved = JSON.parse(localStorage.getItem('studioLangs') || '[]'); document.querySelectorAll('input[name=deflang]').forEach((i) => { i.checked = saved.includes(i.value); }); } catch {}
document.querySelectorAll('input[name=deflang]').forEach((i) => i.onchange = () => { try { localStorage.setItem('studioLangs', JSON.stringify(defLangs())); } catch {} });

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

function render(drafts) {
  $('#list').innerHTML = drafts.map((d) => `
    <div class="draft" data-id="${esc(d.id)}">
      <div class="meta"><span class="badge ${esc(d.status)}">${esc(d.status)}</span>
        <span>${esc(d.forDate)}</span><span>${esc(d.offer.from.name)} → ${esc(d.offer.to.name)}</span>
        <span>${esc(d.offer.price)} €</span></div>
      ${(d.photoCandidates || []).length ? `
        <div class="photo-pick"><h3>Foto wählen <small>(beste zuerst, Bewertung durch KI)</small></h3>
          <div class="row"><button class="ok" data-act="photo-auto">⚡ Automatisch: bestes Foto</button><button class="ghost" data-act="photo">Mehr Fotos</button></div>
          <div class="cands">${d.photoCandidates.map((c) => `<button class="cand" data-act="photo-pick" data-pid="${Number(c.id)}"><img src="${esc(c.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span>${c.score == null ? '–' : Number(c.score) + '/10'}</span></button>`).join('')}</div>
        </div>` : (d.needsPhoto ? '<p class="warn">⚠ Kein passendes echtes Foto gefunden. Bitte eigenes Foto hochladen (⬆) oder im Notfall 🤖 KI-Foto.</p>' : '')}
      <div class="tools">
        <select data-act="style">${STYLE_NAMES.map(([v, n]) => `<option value="${v}" ${v === d.style ? 'selected' : ''}>${n}</option>`).join('')}</select>
        ${['de', 'ar', 'ckb'].map((l) => `<label class="chk"><input type="checkbox" data-lang-box value="${l}" ${(d.langs || []).includes(l) ? 'checked' : ''}> ${LANG[l]}</label>`).join('')}
        <button class="ghost" data-act="langs">Sprachen übernehmen</button>
      </div>
      <div class="row">
        <button class="ghost" data-act="photo">🖼 Fotos zeigen</button>
        <label class="ghost" style="padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700">⬆ Eigenes Foto<input type="file" accept="image/jpeg,image/png,image/webp" data-act="upload" hidden></label>
        <button class="ghost" data-act="text">✍ Neuer Text</button>
        <button class="ghost" data-act="all">↻ Alles neu</button>
        <button class="ghost" data-act="photo-ai" title="Nur wenn kein echtes Foto passt">🤖 KI-Foto (Notfall)</button>
      </div>
      ${d.versions.map((v) => `
        <h3>${esc(LANG[v.lang] || v.lang)} ${v.aiWritten ? '' : '(Standardtext)'}</h3>
        <div class="imgs">${v.files.map((f) => `<a href="${esc(f.url)}" download><img src="${esc(f.url)}" alt="${esc(f.size)} ${f.slide}" loading="lazy"></a>`).join('')}</div>
        <textarea dir="${v.lang === 'de' ? 'ltr' : 'rtl'}" data-lang="${esc(v.lang)}">${esc(v.caption)}</textarea>
        <div class="row"><button class="ghost" data-act="save" data-lang="${esc(v.lang)}">Text speichern</button>
          <button class="ghost" data-act="copy" data-lang="${esc(v.lang)}">Text kopieren</button></div>`).join('')}
      <div class="row"><button class="ok" data-act="approved">Freigeben</button><button class="no" data-act="rejected">Ablehnen</button>${d.status === 'rejected' ? '<button class="no" data-act="delete">🗑 Löschen</button>' : ''}</div>
    </div>`).join('') || '<p>Noch keine Entwürfe.</p>';
}

async function load() { render(await api('/api/studio/drafts')); }

$('#gen').onclick = async () => {
  $('#gen').disabled = true; $('#msg').textContent = 'Erstelle Entwurf … (ca. 1 Minute)';
  try { await api('/api/studio/drafts', { method: 'POST', body: JSON.stringify(defLangs().length ? { langs: defLangs() } : {}) }); $('#msg').textContent = 'Fertig.'; await load(); }
  catch (e) { $('#msg').textContent = 'Fehler: ' + e.message; }
  $('#gen').disabled = false;
};

async function regen(box, what, value) {
  box.classList.add('busy'); $('#msg').textContent = 'Wird neu erstellt … (bis ca. 1 Minute)';
  try { await api(`/api/studio/drafts/${box.dataset.id}/regenerate`, { method: 'POST', body: JSON.stringify({ what, value }) }); $('#msg').textContent = 'Fertig.'; await load(); }
  catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; box.classList.remove('busy'); }
}
$('#list').onchange = async (e) => {
  const box = e.target.closest('.draft'); if (!box) return;
  if (e.target.dataset.act === 'style') return regen(box, 'style', e.target.value);
  if (e.target.dataset.act === 'upload' && e.target.files[0]) return regen(box, 'photo-upload', await readFile(e.target.files[0]));
};
$('#list').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const box = b.closest('.draft'); const id = box.dataset.id; const act = b.dataset.act;
  if (act === 'photo-ai' && !confirm('KI-Foto nur im Notfall verwenden. Fortfahren?')) return;
  if (act === 'photo-pick') return regen(box, 'photo-pick', Number(b.dataset.pid));
  if (['photo', 'photo-auto', 'photo-ai', 'text', 'all'].includes(act)) return regen(box, act);
  if (act === 'langs') return regen(box, 'langs', [...box.querySelectorAll('[data-lang-box]:checked')].map((i) => i.value));
  if (act === 'delete') {
    if (!confirm('Diesen abgelehnten Entwurf endgültig löschen?')) return;
    try { await api('/api/studio/drafts/' + id, { method: 'DELETE' }); $('#msg').textContent = 'Gelöscht.'; await load(); }
    catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; }
    return;
  }
  const ta = b.dataset.lang && box.querySelector(`textarea[data-lang="${b.dataset.lang}"]`);
  try {
    if (act === 'copy') { await navigator.clipboard.writeText(ta.value); $('#msg').textContent = 'Kopiert.'; return; }
    if (act === 'save') await api('/api/studio/drafts/' + id, { method: 'PATCH', body: JSON.stringify({ lang: b.dataset.lang, caption: ta.value }) });
    else await api('/api/studio/drafts/' + id, { method: 'PATCH', body: JSON.stringify({ status: act }) });
    $('#msg').textContent = 'Gespeichert.'; await load();
  } catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; }
};

// ---- manual offers ----
const readFile = (file) => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(file); });
const deToIso = (d) => { const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(d || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
const priceNum = (p) => { const m = /(\d{1,3}(?:\.\d{3})*|\d+)(?:,(\d{1,2}))?/.exec(String(p || '')); return m ? Number(m[1].replace(/\./g, '') + '.' + (m[2] || '0')) : ''; };
function fillForm(f) {
  $('#fromName').value = f.origin || ''; $('#toName').value = f.destination || '';
  $('#departureDate').value = deToIso(f.date_out); $('#returnDate').value = deToIso(f.date_return);
  $('#price').value = priceNum(f.price);
}
$('#shot').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  $('#msg').textContent = 'Lese Screenshot …';
  try { const { fields } = await api('/api/extract', { method: 'POST', body: JSON.stringify({ image: await readFile(file), offer_type: 'flight' }) });
    fillForm(fields); $('#msg').textContent = 'Felder ausgefüllt – bitte prüfen.'; }
  catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; }
};
$('#pdf').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  $('#msg').textContent = 'Lese PDF …';
  try { const { offers } = await api('/api/extract-pdf', { method: 'POST', body: JSON.stringify({ pdf: await readFile(file), offer_type: 'flight' }) });
    $('#pdfOffers').innerHTML = offers.map((o, i) => `<button class="ghost" data-i="${i}">${esc(o.origin)} → ${esc(o.destination)} · ${esc(o.price)}</button>`).join('');
    $('#pdfOffers').onclick = (ev) => { const b = ev.target.closest('button'); if (b) fillForm(offers[b.dataset.i]); };
    $('#msg').textContent = offers.length + ' Angebote gefunden – eines auswählen.'; }
  catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; }
};
$('#manualGo').onclick = async () => {
  const v = (id) => $('#' + id).value.trim();
  const body = { fromName: v('fromName'), fromCode: v('fromCode').toUpperCase(), toName: v('toName'), toCode: v('toCode').toUpperCase(),
    departureDate: v('departureDate'), returnDate: v('returnDate'), price: v('price'), airline: v('airline'), style: v('style') };
  if (defLangs().length) body.langs = defLangs();
  const file = $('#photo').files[0]; if (file) body.photo = await readFile(file);
  $('#manualGo').disabled = true; $('#msg').textContent = 'Erstelle Entwurf … (ca. 1 Minute)';
  try { await api('/api/studio/manual', { method: 'POST', body: JSON.stringify(body) }); $('#msg').textContent = 'Fertig.'; await load(); }
  catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; }
  $('#manualGo').disabled = false;
};

load();
</script>
</body>
</html>
