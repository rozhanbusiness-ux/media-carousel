<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEDIA Studio</title>
<style>
  :root { --navy: #0a1838; --gold: #e6c25a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0d1b3e; color: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--navy); border-bottom: 1px solid rgba(230,194,90,.4); position: sticky; top: 0; z-index: 2; }
  header b { color: var(--gold); letter-spacing: .2em; }
  header a { color: #cfd6e6; font-size: 14px; }
  main { max-width: 1100px; margin: auto; padding: 16px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
  .primary { background: linear-gradient(135deg,#f7e7a8,#c9a227); color: var(--navy); }
  .ok { background: #2e7d4f; color: #fff; } .no { background: #8b2f2f; color: #fff; } .ghost { background: rgba(255,255,255,.12); color: #fff; }
  .draft { background: rgba(255,255,255,.06); border: 1px solid rgba(230,194,90,.3); border-radius: 16px; padding: 16px; margin: 16px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: #cfd6e6; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .pending { background: #b08a17; } .approved { background: #2e7d4f; } .rejected { background: #8b2f2f; }
  .imgs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; }
  .imgs a img { height: 220px; border-radius: 8px; display: block; }
  textarea { width: 100%; min-height: 200px; border-radius: 10px; padding: 10px; font: 14px/1.5 system-ui; background: #08122b; color: #fff; border: 1px solid rgba(255,255,255,.2); }
  textarea[dir=rtl] { text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  h3 { margin: 14px 0 4px; font-size: 15px; color: var(--gold); }
  #msg { margin: 10px 0; color: #f7e7a8; }
</style>
</head>
<body>
<header><b>MEDIA STUDIO</b><a href="/">← Carousel</a></header>
<main>
  <button class="primary" id="gen">Heutigen Entwurf erstellen</button>
  <div id="msg"></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LANG = { de: 'Deutsch', ar: 'العربية', ckb: 'کوردی (بادینی)' };

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

function render(drafts) {
  $('#list').innerHTML = drafts.map((d) => `
    <div class="draft" data-id="${esc(d.id)}">
      <div class="meta"><span class="badge ${esc(d.status)}">${esc(d.status)}</span>
        <span>${esc(d.forDate)}</span><span>${esc(d.offer.from.name)} → ${esc(d.offer.to.name)}</span>
        <span>${esc(d.offer.price)} €</span><span>Stil: ${esc(d.style)}</span></div>
      ${d.versions.map((v) => `
        <h3>${esc(LANG[v.lang] || v.lang)} ${v.aiWritten ? '' : '(Standardtext)'}</h3>
        <div class="imgs">${v.files.map((f) => `<a href="${esc(f.url)}" download><img src="${esc(f.url)}" alt="${esc(f.size)} ${f.slide}" loading="lazy"></a>`).join('')}</div>
        <textarea dir="${v.lang === 'de' ? 'ltr' : 'rtl'}" data-lang="${esc(v.lang)}">${esc(v.caption)}</textarea>
        <div class="row"><button class="ghost" data-act="save" data-lang="${esc(v.lang)}">Text speichern</button>
          <button class="ghost" data-act="copy" data-lang="${esc(v.lang)}">Text kopieren</button></div>`).join('')}
      <div class="row"><button class="ok" data-act="approved">Freigeben</button><button class="no" data-act="rejected">Ablehnen</button></div>
    </div>`).join('') || '<p>Noch keine Entwürfe.</p>';
}

async function load() { render(await api('/api/studio/drafts')); }

$('#gen').onclick = async () => {
  $('#gen').disabled = true; $('#msg').textContent = 'Erstelle Entwurf … (ca. 1 Minute)';
  try { await api('/api/studio/drafts', { method: 'POST', body: '{}' }); $('#msg').textContent = 'Fertig.'; await load(); }
  catch (e) { $('#msg').textContent = 'Fehler: ' + e.message; }
  $('#gen').disabled = false;
};

$('#list').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const box = b.closest('.draft'); const id = box.dataset.id; const act = b.dataset.act;
  const ta = b.dataset.lang && box.querySelector(`textarea[data-lang="${b.dataset.lang}"]`);
  try {
    if (act === 'copy') { await navigator.clipboard.writeText(ta.value); $('#msg').textContent = 'Kopiert.'; return; }
    if (act === 'save') await api('/api/studio/drafts/' + id, { method: 'PATCH', body: JSON.stringify({ lang: b.dataset.lang, caption: ta.value }) });
    else await api('/api/studio/drafts/' + id, { method: 'PATCH', body: JSON.stringify({ status: act }) });
    $('#msg').textContent = 'Gespeichert.'; await load();
  } catch (err) { $('#msg').textContent = 'Fehler: ' + err.message; }
};

load();
</script>
</body>
</html>
