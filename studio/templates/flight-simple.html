<!doctype html>
<!--
  Studio template "flight-simple" (Schlicht): WhatsApp status / story offer post. The photo is the
  hero (AI poster scene or real photo with calm sky at the top); the text is minimal and sits in
  the upper third: navy price plate, one route line, a small trip tag. Logo and slogan at the
  bottom. Inspired by the client's competitor reference, but deliberately different: full-screen
  9:16 instead of a square inside the story, navy price plate with a gold underline instead of a red square, our slogan
  instead of a hashtag (client decision 2026-10-30). Same placeholders and slide contract as
  "flight". All values are HTML-escaped.
-->
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="{{fontCss}}" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --w: 1080px; --h: 1350px; --gold: #e6c25a; --navy: #0a1838; --u: 1px; }
  .story { --h: 1920px; }
  .square { --h: 1080px; --u: 0.86px; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--navy); }
  .post { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: #fff; font-family: "Plus Jakarta Sans", "IBM Plex Sans Arabic", sans-serif;
    background: linear-gradient(170deg, #1d3d78 0%, #0f2350 45%, #070f26 100%); }
  .rtl .post, .rtl .post * { font-family: "IBM Plex Sans Arabic", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Soft shade only behind the text (top) and the logo (bottom); the scene stays clear */
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,10,28,.5) 0%, rgba(4,10,28,.18) 26%, rgba(4,10,28,0) 40%, rgba(4,10,28,0) 76%, rgba(4,10,28,.55) 100%); }

  .top { position: absolute; top: calc(120 * var(--u)); left: 70px; right: 70px; text-align: center; }
  .story .top { top: 250px; }

  /* Price plate: navy, gold underline, "189 EUR" on one line, same order in every language (client) */
  .seal { display: inline-flex; align-items: baseline; gap: .3em; direction: ltr; unicode-bidi: isolate; padding: calc(12 * var(--u)) calc(30 * var(--u));
    background: var(--navy); color: #fff; border-bottom: calc(5 * var(--u)) solid var(--gold); box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .seal .p { font-size: calc(110 * var(--u)); line-height: 1; }
  .seal .pr .pt span:last-child { display: none; } /* "EUR" stands next to it instead of the € sign */
  .seal small { font-size: calc(34 * var(--u)); font-weight: 800; letter-spacing: .14em; color: var(--gold); font-family: "Plus Jakarta Sans", sans-serif !important; }

  .route { margin-top: calc(40 * var(--u)); font-size: calc(76 * var(--u)); font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .rtl .route { font-size: calc(70 * var(--u)); }
  .route .ic { width: .62em; height: .62em; vertical-align: .02em; color: var(--gold); margin: 0 .22em; display: inline-block; transform: rotate(90deg); }
  .rtl .route .ic { transform: rotate(-90deg); }
  .trip { margin-top: calc(10 * var(--u)); font-size: calc(32 * var(--u)); font-weight: 600; }
  .trip:empty { display: none; }
  .hotel { margin-top: calc(18 * var(--u)); font-size: calc(36 * var(--u)); font-weight: 600; }

  .foot { position: absolute; bottom: calc(80 * var(--u)); left: 0; right: 0; text-align: center; }
  .story .foot { bottom: 210px; }
  .foot img { width: calc(230 * var(--u)); filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  .foot .slogan { margin-top: calc(6 * var(--u)) !important; }
  .foot .slogan span { font-size: calc(54 * var(--u)) !important; }

  /* Slide 3 (carousels only): closing words */
  .end { position: absolute; left: 80px; right: 80px; top: 42%; transform: translateY(-50%); text-align: center; }
  .end .big { font-size: calc(86 * var(--u)); font-weight: 800; line-height: 1.12; text-wrap: balance; }
  .end .sub { margin-top: calc(22 * var(--u)); font-size: calc(34 * var(--u)); font-weight: 600; line-height: 1.35; text-wrap: balance; }
  .end .cta { display: inline-block; margin-top: calc(36 * var(--u)); padding: calc(22 * var(--u)) calc(52 * var(--u)); border-radius: 999px;
    background: linear-gradient(135deg, #f7e7a8, #c9a227); color: var(--navy); font-size: calc(32 * var(--u)); font-weight: 800; white-space: nowrap; }
</style>
</head>
<body class="{{size}} {{dir}} k-{{kind}}">
  <div class="post s{{slide}}">
    <img class="bg" src="{{photo}}" style="object-position: {{photoPosition}}" alt="" />
    <div class="shade"></div>

    <!-- slides 1 and 2: the offer (slide 2 repeats it for carousels) -->
    <div class="top" data-only="12">
      <div class="seal"><div class="p">{{price}}</div><small>EUR</small></div>
      <div class="route flt">{{fromCity}}<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>{{toCity}}</div>
      <div class="trip flt">{{trip}}</div>
      <div class="route pkg">{{destination}}</div>
      <div class="hotel pkg">{{hotel}}</div>
    </div>

    <!-- slide 3 -->
    <div class="end" data-only="3">
      <div class="big">{{ctaTitle}}</div>
      <div class="sub">{{ctaText}}</div>
      <div class="cta">{{ctaButton}}</div>
    </div>

    <div class="foot"><img src="{{logo}}" alt="MEDIA" />%%SLOGAN%%</div>
  </div>
  <style>
    [data-only] { display: none; }
    .s1 [data-only="12"], .s2 [data-only="12"], .s3 [data-only="3"] { display: block; }
    .k-flight .pkg, .k-package .flt { display: none !important; }
  </style>
</body>
</html>
