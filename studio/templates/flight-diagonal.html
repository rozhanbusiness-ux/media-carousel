<!doctype html>
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8" /><link rel="stylesheet" href="{{fontCss}}" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --w: 1080px; --h: 1350px; --gold: #e6c25a; --navy: #0a1838; --cream: #f6f0e1; --u: 1px; }
.story { --h: 1920px; } .square { --h: 1080px; --u: .86px; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--navy); }
.post { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: #fff; font-family: "Plus Jakarta Sans", sans-serif; }
.rtl .post, .rtl .post * { font-family: "IBM Plex Sans Arabic", sans-serif; }
.gold { color: var(--gold); } .script { font-family: "Allura", cursive; font-weight: 400; } .serif { font-family: "DM Serif Display", serif; font-weight: 400; }
.trk { letter-spacing: .4em; text-transform: uppercase; font-weight: 600; font-size: calc(20 * var(--u)); }
.logo { position: absolute; top: calc(60 * var(--u)); left: 50%; transform: translateX(-50%); width: calc(200 * var(--u)); z-index: 5; }
.cta { display: inline-block; padding: calc(24 * var(--u)) calc(56 * var(--u)); border-radius: 999px; font-weight: 800; font-size: calc(32 * var(--u)); color: var(--navy); background: linear-gradient(135deg,#f7e7a8,#c9a227); box-shadow: 0 14px 40px rgba(201,162,39,.35); }
.notice { position: absolute; bottom: calc(46 * var(--u)); width: 100%; text-align: center; font-size: calc(17 * var(--u)); opacity: .7; z-index: 5; }
[data-only] { display: none !important; } .s1 [data-only~="1"], .s2 [data-only~="2"], .s3 [data-only~="3"] { display: block !important; }
.rtl .title, .rtl .big { font-weight: 700 !important; font-size: calc(96 * var(--u)) !important; line-height: 1.2 !important; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; clip-path: polygon(0 0, 100% 0, 100% 58%, 0 74%); }
.story .bg { clip-path: polygon(0 0, 100% 0, 100% 62%, 0 74%); }
.edge { position: absolute; inset: 0; background: var(--gold); clip-path: polygon(0 74%, 100% 58%, 100% 59.2%, 0 75.2%); }
.story .edge { clip-path: polygon(0 74%, 100% 62%, 100% 63%, 0 75%); }
.badge { position: absolute; right: 70px; top: calc(560 * var(--u)); width: calc(260 * var(--u)); height: calc(260 * var(--u)); border-radius: 50%; background: var(--navy); border: 3px solid var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.story .badge { top: 900px; }
.rtl .badge { right: auto; left: 70px; }
.badge small { font-size: calc(20 * var(--u)); letter-spacing: .3em; opacity: .8; }
.badge b { font-size: calc(58 * var(--u)); line-height: 1; }
.low { position: absolute; left: 70px; right: 70px; bottom: calc(110 * var(--u)); }
.title { font-size: calc(170 * var(--u)); line-height: .9; }
.h { font-size: calc(36 * var(--u)); font-weight: 600; margin-top: 12px; opacity: .92; }
.rows { font-size: calc(34 * var(--u)); line-height: 1.7; }
.rows b { color: var(--gold); }
</style></head>
<body class="{{size}} {{dir}}"><div class="post s{{slide}}">
<img class="bg" src="{{photo}}" style="object-position: {{photoPosition}}" alt="" /><div class="edge"></div>
<img class="logo" src="{{logo}}" alt="MEDIA" />
<div class="badge" data-only="1 2"><small>{{priceLabel}}</small><b class="serif gold">{{price}}</b></div>
<div class="low" data-only="1"><div class="trk gold">{{kicker}}</div><div class="title {{titleClass}}">{{destination}}</div><div class="h">{{hook}}</div></div>
<div class="low" data-only="2"><div class="trk gold" style="margin-bottom:14px">{{detailsTitle}}</div><div class="rows"><b>✈</b> {{fromCity}} – {{toCity}}<br /><b>◷</b> {{dates}}<br /><b>✦</b> {{airline}}</div></div>
<div class="low" data-only="3"><div class="title {{titleClass}} gold">{{ctaTitle}}</div><div class="h" style="margin-bottom:26px">{{ctaText}}</div><span class="cta">{{ctaButton}}</span></div>
<div class="notice" data-only="2 3">{{notice}}</div>
</div></body></html>
