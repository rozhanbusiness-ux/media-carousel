<!doctype html>
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8" /><link rel="stylesheet" href="{{fontCss}}" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --w: 1080px; --h: 1350px; --gold: #e6c25a; --navy: #0a1838; --cream: #f6f0e1; --u: 1px; }
.story { --h: 1920px; } .square { --h: 1080px; --u: .86px; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--navy); }
.post { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: #fff; font-family: "Plus Jakarta Sans", sans-serif; }
.rtl .post, .rtl .post * { font-family: "IBM Plex Sans Arabic", sans-serif; }
.gold { color: var(--gold); } .script { font-family: "Allura", cursive; font-weight: 400; } .serif { font-family: "DM Serif Display", serif; font-weight: 400; }
.trk { letter-spacing: .4em; text-transform: uppercase; font-weight: 600; font-size: calc(20 * var(--u)); }
.logo { position: absolute; top: calc(60 * var(--u)); left: 50%; transform: translateX(-50%); width: calc(200 * var(--u)); z-index: 5; }
.cta { display: inline-block; padding: calc(24 * var(--u)) calc(56 * var(--u)); border-radius: 999px; font-weight: 800; font-size: calc(32 * var(--u)); color: var(--navy); background: linear-gradient(135deg,#f7e7a8,#c9a227); box-shadow: 0 14px 40px rgba(201,162,39,.35); }
.notice { position: absolute; bottom: calc(46 * var(--u)); width: 100%; text-align: center; font-size: calc(17 * var(--u)); opacity: .7; z-index: 5; }
[data-only] { display: none !important; } .s1 [data-only~="1"], .s2 [data-only~="2"], .s3 [data-only~="3"] { display: block !important; }
.rtl .title, .rtl .big { font-weight: 700 !important; font-size: calc(96 * var(--u)) !important; line-height: 1.2 !important; }
.post { background: linear-gradient(180deg, #0a1838, #050b1d); }
.lines { position: absolute; inset: 40px; border: 1px solid rgba(230,194,90,.5); }
.lines::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(230,194,90,.25); }
.band { position: absolute; left: 0; right: 0; top: 34%; height: 36%; overflow: hidden; border-top: 3px solid var(--gold); border-bottom: 3px solid var(--gold); }
.band img { width: 100%; height: 100%; object-fit: cover; }
.top { position: absolute; left: 80px; right: 80px; top: calc(170 * var(--u)); text-align: center; }
.title { font-size: calc(150 * var(--u)); line-height: .95; }
.low { position: absolute; left: 80px; right: 80px; top: 72%; text-align: center; }
.h { font-size: calc(36 * var(--u)); font-weight: 600; opacity: .92; }
.route { font-size: calc(42 * var(--u)); font-weight: 800; }
.price { font-size: calc(110 * var(--u)); line-height: 1; }

.ic { width: 1em; height: 1em; vertical-align: -0.14em; color: var(--gold); display: inline-block; }
.pl { transform: rotate(90deg); } .rtl .pl { transform: rotate(-90deg); }
</style></head>
<body class="{{size}} {{dir}}"><div class="post s{{slide}}">
<div class="lines"></div>
<img class="logo" src="{{logo}}" alt="MEDIA" />
<div class="band"><img src="{{photo}}" style="object-position: {{photoPosition}}" alt="" /></div>
<div class="top" data-only="1 2"><div class="trk gold">{{kicker}}</div><div class="title {{titleClass}}">{{destination}}</div></div>
<div class="top" data-only="3"><div class="title {{titleClass}} gold">{{ctaTitle}}</div></div>
<div class="low" data-only="1"><div class="h">{{hook}}</div></div>
<div class="low" data-only="2"><div class="route">{{fromCity}} <svg class="ic pl" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg> {{toCity}}</div><div class="h" style="margin:8px 0 10px">{{dates}}</div><div class="price serif gold">{{price}}</div></div>
<div class="low" data-only="3"><div class="h" style="margin-bottom:24px">{{ctaText}}</div><span class="cta">{{ctaButton}}</span>%%SLOGAN%%</div>
<div class="notice" data-only="2 3">{{notice}}</div>
</div></body></html>
