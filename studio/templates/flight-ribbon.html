<!doctype html>
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8" /><link rel="stylesheet" href="{{fontCss}}" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --w: 1080px; --h: 1350px; --gold: #e6c25a; --navy: #0a1838; --cream: #f6f0e1; --u: 1px; }
.story { --h: 1920px; } .square { --h: 1080px; --u: .86px; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--navy); }
.post { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: #fff; font-family: "Plus Jakarta Sans", sans-serif; }
.rtl .post, .rtl .post * { font-family: "IBM Plex Sans Arabic", sans-serif; }
.gold { color: var(--gold); } .script { font-family: "Allura", cursive; font-weight: 400; } .serif { font-family: "DM Serif Display", serif; font-weight: 400; }
.trk { letter-spacing: .4em; text-transform: uppercase; font-weight: 600; font-size: calc(20 * var(--u)); }
.logo { position: absolute; top: calc(60 * var(--u)); left: 50%; transform: translateX(-50%); width: calc(200 * var(--u)); z-index: 5; }
.cta { display: inline-block; padding: calc(24 * var(--u)) calc(56 * var(--u)); border-radius: 999px; font-weight: 800; font-size: calc(32 * var(--u)); color: var(--navy); background: linear-gradient(135deg,#f7e7a8,#c9a227); box-shadow: 0 14px 40px rgba(201,162,39,.35); }
.notice { position: absolute; bottom: calc(46 * var(--u)); width: 100%; text-align: center; font-size: calc(17 * var(--u)); opacity: .7; z-index: 5; }
[data-only] { display: none !important; } .s1 [data-only~="1"], .s2 [data-only~="2"], .s3 [data-only~="3"] { display: block !important; }
.rtl .title, .rtl .big { font-weight: 700 !important; font-size: calc(96 * var(--u)) !important; line-height: 1.2 !important; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,10,28,.1) 30%, rgba(4,10,28,.9) 85%); }
.s2 .bg, .s3 .bg { filter: brightness(.55); }
.ribbon { position: absolute; top: calc(70 * var(--u)); right: -110px; width: 460px; transform: rotate(40deg); text-align: center; padding: 18px 0; background: linear-gradient(135deg,#f7e7a8,#c9a227); color: var(--navy); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
.rtl .ribbon { right: auto; left: -110px; transform: rotate(-40deg); }
.ribbon small { display: block; font-size: calc(16 * var(--u)); letter-spacing: .3em; font-weight: 700; }
.ribbon b { font-size: calc(54 * var(--u)); line-height: 1; }
.logo { left: 60px; transform: none; }
.rtl .logo { left: auto; right: 60px; }
.low { position: absolute; left: 70px; right: 70px; bottom: calc(120 * var(--u)); }
.caps { font-family: "DM Serif Display", serif; font-size: calc(150 * var(--u)); line-height: .9; text-transform: uppercase; letter-spacing: .02em; }
.h { font-size: calc(38 * var(--u)); font-weight: 600; margin-top: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 30px; margin-top: 24px; }
.grid small { display: block; font-size: calc(17 * var(--u)); letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.grid p { font-size: calc(34 * var(--u)); font-weight: 800; }
</style></head>
<body class="{{size}} {{dir}}"><div class="post s{{slide}}">
<img class="bg" src="{{photo}}" style="object-position: {{photoPosition}}" alt="" /><div class="shade"></div>
<img class="logo" src="{{logo}}" alt="MEDIA" />
<div class="ribbon" data-only="1 2"><small>{{priceLabel}}</small><b class="serif">{{price}}</b></div>
<div class="low" data-only="1"><div class="trk gold">{{kicker}}</div><div class="caps">{{destination}}</div><div class="h">{{hook}}</div></div>
<div class="low" data-only="2"><div class="caps" style="font-size:calc(100*var(--u))">{{destination}}</div><div class="grid"><div><small>{{fromLabel}}</small><p>{{fromCity}}</p></div><div><small>{{toLabel}}</small><p>{{toCity}}</p></div><div><small>{{datesLabel}}</small><p style="font-size:calc(28*var(--u))">{{dates}}</p></div></div></div>
<div class="low" data-only="3"><div class="caps gold">{{ctaTitle}}</div><div class="h" style="margin-bottom:26px">{{ctaText}}</div><span class="cta">{{ctaButton}}</span>%%SLOGAN%%</div>
<div class="notice" data-only="2 3">{{notice}}</div>
</div></body></html>
