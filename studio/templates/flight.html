<!doctype html>
<!--
  Studio template "flight": 3 slides (hook, details, call to action) in 3 sizes
  (story 1080x1920, portrait 1080x1350, square 1080x1080). One file: the body class picks
  the size and slide. All placeholders are HTML-escaped by the renderer.
-->
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="{{fontCss}}" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --w: 1080px; --h: 1350px; --gold: #e6c25a; --navy: #0a1838; --u: 1px; }
  .story { --h: 1920px; }
  .square { --h: 1080px; --u: 0.86px; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--navy); }
  .post { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: #fff;
    font-family: "Plus Jakarta Sans", sans-serif; }
  .rtl .post, .rtl .post * { font-family: "IBM Plex Sans Arabic", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; }
  .frame { position: absolute; inset: 28px; border: 1.5px solid rgba(230,194,90,.7); border-radius: 6px; }
  .logo { position: absolute; top: calc(64 * var(--u)); left: 50%; transform: translateX(-50%); width: calc(210 * var(--u)); }
  .gold { color: var(--gold); }
  .script { font-family: "Allura", cursive; font-weight: 400; }
  .serif { font-family: "DM Serif Display", serif; font-weight: 400; }
  .tracking { letter-spacing: .42em; text-transform: uppercase; font-weight: 600; }
  .glass { background: rgba(10,24,56,.45); backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(230,194,90,.45); border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18); }
  .dots { position: absolute; bottom: calc(46 * var(--u)); width: 100%; display: flex; justify-content: center; gap: 12px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dots i.on { background: var(--gold); width: 30px; border-radius: 6px; }

  /* Slide 1: hook */
  .s1 .shade { background: linear-gradient(180deg, rgba(4,10,28,.55) 0%, rgba(4,10,28,0) 24%, rgba(4,10,28,0) 46%, rgba(4,10,28,.85) 80%, rgba(4,10,28,.95) 100%); }
  .s1 .block { position: absolute; left: 70px; right: 70px; bottom: calc(130 * var(--u)); text-align: center; }
  .s1 .kicker { font-size: calc(22 * var(--u)); margin-bottom: calc(14 * var(--u)); }
  .s1 .title { font-size: calc(230 * var(--u)); line-height: .95; margin: 0 0 calc(34 * var(--u));
    text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .rtl .s1 .title { font-weight: 700; font-size: calc(140 * var(--u)); line-height: 1.15; margin-bottom: calc(26 * var(--u)); }
  .s1 .hook { font-size: calc(44 * var(--u)); font-weight: 700; line-height: 1.32; max-width: calc(840 * var(--u)); margin: 0 auto; text-wrap: balance; }
  .s1 .swipe { margin-top: calc(34 * var(--u)); font-size: calc(20 * var(--u)); color: rgba(255,255,255,.75); }
  .story .s1 .block { bottom: 300px; }

  /* Slide 2: details */
  .s2 .bg { filter: blur(6px) brightness(.55); transform: scale(1.08); }
  .s2 .shade { background: radial-gradient(120% 80% at 50% 30%, rgba(10,24,56,.25), rgba(4,10,28,.9)); }
  .s2 .card { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-46%);
    padding: calc(56 * var(--u)) calc(56 * var(--u)); text-align: center; }
  .s2 .kicker { font-size: calc(20 * var(--u)); }
  .s2 .route { margin: calc(26 * var(--u)) 0; display: flex; align-items: center; justify-content: center; gap: 28px; }
  .s2 .city b { display: block; font-size: calc(54 * var(--u)); font-weight: 800; line-height: 1.1; }
  .s2 .city span { font-size: calc(22 * var(--u)); letter-spacing: .3em; color: rgba(255,255,255,.7); }
  .s2 .plane { font-size: calc(44 * var(--u)); color: var(--gold); }

  .s2 .line { height: 1px; background: linear-gradient(90deg, transparent, rgba(230,194,90,.8), transparent); margin: calc(26 * var(--u)) 0; }
  .s2 .row { font-size: calc(28 * var(--u)); line-height: 1.8; color: rgba(255,255,255,.9); }
  .s2 .price small { display: block; font-size: calc(22 * var(--u)); letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .s2 .price > span { font-size: calc(150 * var(--u)); line-height: 1; }
  .s2 .price small { display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--gold); letter-spacing: .3em; }
  .s2 .price small::before, .s2 .price small::after { content: ""; width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .s2 .price small::after { transform: scaleX(-1); }
  .s2 .price > span { font-size: calc(132 * var(--u)) !important; margin: calc(10 * var(--u)) 0 calc(4 * var(--u)); background: none !important; -webkit-text-fill-color: initial !important; }
  .s2 .price .pr { background: linear-gradient(180deg, #fff3c8 0%, #f0d27a 40%, #c9a227 75%, #a8831a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
  .s2 .price em { display: inline-block; margin-top: calc(10 * var(--u)); padding: 6px 18px; border: 1px solid rgba(230,194,90,.45); border-radius: 999px; letter-spacing: .08em; }
  .s2 .price em { font-style: normal; font-size: calc(22 * var(--u)); color: rgba(255,255,255,.75); }

  /* Slide 3: call to action */
  .s3 .shade { background: linear-gradient(180deg, rgba(4,10,28,.35), rgba(4,10,28,.88)); }
  .s3 .block { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-40%); text-align: center; }
  .s3 .big { font-size: calc(150 * var(--u)); line-height: 1; }
  .rtl .s3 .big { font-weight: 700; font-size: calc(96 * var(--u)); line-height: 1.2; }
  .s3 .sub { font-size: calc(36 * var(--u)); font-weight: 600; line-height: 1.35; margin: calc(28 * var(--u)) 0 calc(52 * var(--u)); text-wrap: balance; }
  .s3 .cta { display: inline-block; padding: calc(26 * var(--u)) calc(60 * var(--u)); border-radius: 999px;
    font-size: calc(34 * var(--u)); font-weight: 800; color: var(--navy);
    background: linear-gradient(135deg, #f7e7a8, #c9a227); box-shadow: 0 14px 40px rgba(201,162,39,.4); }
  .s3 .site { margin-top: calc(38 * var(--u)); font-size: calc(24 * var(--u)); letter-spacing: .25em; color: rgba(255,255,255,.8); }
  .s3 .notice { position: absolute; left: 90px; right: 90px; bottom: calc(100 * var(--u)); text-align: center; font-size: calc(21 * var(--u)); line-height: 1.4; color: rgba(255,255,255,.8); text-wrap: balance; }
  .story .s3 .notice { bottom: 170px; }

.ic { width: 1em; height: 1em; vertical-align: -0.14em; color: var(--gold); display: inline-block; }
.pl { transform: rotate(90deg); } .rtl .pl { transform: rotate(-90deg); }
</style>
</head>
<body class="{{size}} {{dir}}">
  <div class="post s{{slide}}">
    <img class="bg" src="{{photo}}" style="object-position: {{photoPosition}}" alt="" />
    <div class="shade"></div>
    <div class="frame"></div>
    <img class="logo" src="{{logo}}" alt="MEDIA" />

    <!-- slide 1 -->
    <div class="block" data-only="1">
      <div class="kicker tracking gold">{{kicker}}</div>
      <div class="title {{titleClass}}">{{destination}}</div>
      <div class="hook">{{hook}}</div>
      <div class="swipe">{{swipe}}</div>
    </div>

    <!-- slide 2 -->
    <div class="card glass" data-only="2">
      <div class="kicker tracking gold">{{detailsTitle}}</div>
      <div class="route">
        <div class="city"><b>{{fromCity}}</b><span>{{fromCode}}</span></div>
        <div class="plane"><svg class="ic pl" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
        <div class="city"><b>{{toCity}}</b><span>{{toCode}}</span></div>
      </div>
      <div class="row">{{dates}}</div>
      <div class="line"></div>
      <div class="price"><small>{{priceLabel}}</small><span class="serif gold">{{price}}</span><br /><em>{{perPerson}}</em></div>
    </div>

    <!-- slide 3 -->
    <div class="block" data-only="3">
      <div class="big {{titleClass}} gold">{{ctaTitle}}</div>
      <div class="sub">{{ctaText}}</div>
      <div class="cta">{{ctaButton}}</div>
      <div class="site">MEDIA-TRAVELS.COM</div>
    </div>
    <div class="notice" data-only="3">{{notice}}</div>

    <div class="dots"><i class="d1"></i><i class="d2"></i><i class="d3"></i></div>
  </div>
  <style>
    [data-only] { display: none; }
    .s1 [data-only="1"], .s2 [data-only="2"], .s3 [data-only="3"] { display: block; }
    .s1 .d1, .s2 .d2, .s3 .d3 { background: var(--gold); width: 30px; border-radius: 6px; }
  </style>
</body>
</html>
